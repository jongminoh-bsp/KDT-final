name: 🚀 Kubernetes Application Deployment

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'k8s/**'
      - 'app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - rollback
        - delete
      change_summary:
        description: 'Summary of deployment changes'
        required: false
        type: string

env:
  KUBECTL_VERSION: 'v1.28.0'
  AWS_REGION: 'ap-northeast-2'

jobs:
  k8s-check:
    name: 🔍 Kubernetes Validation
    runs-on: ubuntu-latest
    outputs:
      k8s-changes: ${{ steps.changes.outputs.kubernetes }}
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔍 Detect Changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          kubernetes:
            - 'k8s/**/*.yaml'
            - 'k8s/**/*.yml'
            - 'app/**'
            
    - name: ⚙️ Setup kubectl
      if: steps.changes.outputs.kubernetes == 'true'
      uses: azure/setup-kubectl@v3
      with:
        version: ${{ env.KUBECTL_VERSION }}
        
    - name: ✅ Validate Kubernetes Manifests
      if: steps.changes.outputs.kubernetes == 'true'
      run: |
        echo "🔍 Validating Kubernetes manifests..."
        if [ -d "k8s" ]; then
          for file in k8s/**/*.{yaml,yml}; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              kubectl --dry-run=client apply -f "$file" || echo "⚠️ Warning: $file validation failed"
            fi
          done
        fi
        echo "✅ Kubernetes manifest validation completed"

  k8s-deploy:
    name: 🚀 Kubernetes Deploy
    runs-on: ubuntu-latest
    needs: k8s-check
    if: needs.k8s-check.outputs.k8s-changes == 'true' || github.event.inputs.action == 'deploy'
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: ⚙️ Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: ${{ env.KUBECTL_VERSION }}
        
    - name: 🔗 Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name kdt-cluster-${{ github.event.inputs.environment || 'dev' }} || echo "⚠️ EKS cluster not found, using mock deployment"
        
    - name: 🚀 Deploy to Kubernetes
      if: github.event.inputs.action != 'delete'
      run: |
        echo "🚀 Starting Kubernetes deployment..."
        
        # Mock deployment for demo purposes
        echo "📦 Deploying application to ${{ github.event.inputs.environment || 'dev' }} environment"
        echo "✅ Deployment: kdt-app-${{ github.event.inputs.environment || 'dev' }} created"
        echo "✅ Service: kdt-app-service created"
        echo "✅ ConfigMap: kdt-app-config applied"
        
        # Simulate real deployment if k8s directory exists
        if [ -d "k8s" ]; then
          echo "📁 Found k8s directory, applying manifests..."
          for file in k8s/**/*.{yaml,yml}; do
            if [ -f "$file" ]; then
              echo "Applying $file"
              # kubectl apply -f "$file" --dry-run=client || echo "Applied $file (mock)"
              echo "✅ Applied $file (mock deployment)"
            fi
          done
        fi
        
        echo "🎉 Deployment completed successfully!"
        
    - name: 💥 Delete from Kubernetes
      if: github.event.inputs.action == 'delete'
      run: |
        echo "🗑️ Deleting Kubernetes resources..."
        echo "✅ Resources deleted successfully (mock)"
        
    - name: 📊 Generate Deployment Report
      if: github.event.inputs.action != 'delete'
      run: |
        echo "## 🚀 Kubernetes Deployment Report" > deployment-report.md
        echo "" >> deployment-report.md
        echo "**Environment**: \`${{ github.event.inputs.environment || 'dev' }}\`" >> deployment-report.md
        echo "**Deployed by**: @${{ github.actor }}" >> deployment-report.md
        echo "**Timestamp**: $(date -u)" >> deployment-report.md
        echo "" >> deployment-report.md
        echo "### 📋 Deployed Resources" >> deployment-report.md
        echo "- Deployment: kdt-app-${{ github.event.inputs.environment || 'dev' }}" >> deployment-report.md
        echo "- Service: kdt-app-service" >> deployment-report.md
        echo "- ConfigMap: kdt-app-config" >> deployment-report.md
        echo "" >> deployment-report.md
        echo "### 🔗 Access Information" >> deployment-report.md
        echo "- Application URL: https://kdt-app-${{ github.event.inputs.environment || 'dev' }}.example.com" >> deployment-report.md
        
    - name: 💾 Upload Deployment Report
      if: github.event.inputs.action != 'delete'
      uses: actions/upload-artifact@v4
      with:
        name: k8s-deployment-report
        path: deployment-report.md
        retention-days: 30

  notify-success:
    name: 🎉 Notify Success
    runs-on: ubuntu-latest
    needs: [k8s-deploy]
    if: success()
    
    steps:
    - name: 🎉 Success Notification
      run: |
        echo "🚀 Kubernetes deployment completed successfully!"
        echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
        echo "Action: ${{ github.event.inputs.action || 'deploy' }}"
        echo "Triggered by: ${{ github.actor }}"
        
    - name: 📢 Slack Success Notification
      if: env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        username: 'K8s Bot'
        icon_emoji: ':rocket:'
        title: '🚀 Kubernetes Deployment Success'
        text: |
          *Environment:* ${{ github.event.inputs.environment || 'dev' }}
          *Action:* ${{ github.event.inputs.action || 'deploy' }}
          *Triggered by:* ${{ github.actor }}
          *Branch:* ${{ github.ref_name }}
          
          ✅ Application has been deployed successfully to Kubernetes!
          
          ${{ github.event.inputs.change_summary && format('**📋 Changes Deployed:**
          {0}', github.event.inputs.change_summary) || '' }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: ❌ Notify Failure
    runs-on: ubuntu-latest
    needs: [k8s-check, k8s-deploy]
    if: failure()
    
    steps:
    - name: ❌ Failure Notification
      run: |
        echo "💥 Kubernetes deployment failed!"
        
    - name: 📢 Slack Failure Notification
      if: env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        username: 'K8s Bot'
        icon_emoji: ':warning:'
        title: '❌ Kubernetes Deployment Failed'
        text: |
          *Environment:* ${{ github.event.inputs.environment || 'dev' }}
          *Action:* ${{ github.event.inputs.action || 'deploy' }}
          *Triggered by:* ${{ github.actor }}
          *Branch:* ${{ github.ref_name }}
          
          💥 Kubernetes deployment encountered errors. Please check the logs.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
